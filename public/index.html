<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R4VEY-MD PAIR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora"></div>
<canvas id="particles"></canvas>
<div class="noise"></div>

<div class="container">
  <div class="hero">
    <h1>R4VEY-MD</h1>
    <p>PREMIUM WHATSAPP PAIRING PORTAL</p>
    <span>👋 Welcome to R4VEY-MD<br>Your premium gateway to seamless WhatsApp Multi-Device pairing.<br>Built with ❤️ by Ravey.</span>
  </div>

  <div class="glass-card">
    <label>📱 WhatsApp Number</label>
    <input id="number" placeholder="+2567XXXXXXXX">
    <button id="genBtn">Generate Pair Code</button>
  </div>

  <div class="glass-card pairing-card hidden" id="pairCard">
    <div class="card-header">SECURE PAIRING <span class="dot"></span> READY</div>
    <label>🔑 Pair Code</label>
    <div class="code" id="code">---- ----</div>
    <div class="btns">
      <button onclick="copyCode()">📋 Copy</button>
      <button onclick="refreshCode()">🔄 Refresh</button>
    </div>
    <div class="timer">⏳ Expires in <span id="timer">58</span>s</div>
  </div>

  <div class="grid-2">
    <div class="glass-card dashboard">
      <h3>LIVE DASHBOARD</h3>
      <div id="dash">Loading...</div>
    </div>
    <div class="glass-card activity">
      <h3>LIVE ACTIVITY</h3>
      <div id="activityLog"></div>
    </div>
  </div>

  <div class="music-player">
    <button onclick="toggleMusic()">⏮</button>
    <button id="playBtn" onclick="toggleMusic()">⏸</button>
    <button onclick="toggleMusic()">⏭</button>
    <span id="songTitle">Dandelions — Ruth B.</span> 🔊
    <audio id="bgm" src="https://cdn.pixabay.com/audio/1-1/dandelions-198838.mp3" loop></audio>
  </div>
</div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
